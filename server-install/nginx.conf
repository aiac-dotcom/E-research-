# Replace ranking.example.com, then enable HTTPS before allowing user logins.
# This HTTP configuration is the starting point for your TLS/Certbot setup.
server {
    listen 80;
    server_name ranking.example.com;
    root /opt/qa-dashboard/artifacts/qa-dashboard/dist/public;
    index index.html;
    client_max_body_size 100m;

    # The standalone installation uses Clerk directly, not the Replit proxy.
    location ^~ /api/__clerk { return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}